<style>
/* ================= Farben und Schriften ================= */
:root {
  --bg: #f3f0e9; --card: #fffdf9; --ink: #1e2430; --ink2: #586273; --ink3: #8a93a1; --line: #dcd5c7;
  --accent: #2563eb; --on-accent: #fff; --accent-soft: #e3ecfd;
  --good: #16794a; --good-bg: #e2f4ea; --bad: #b42318; --bad-bg: #fde9e7; --warn: #8a5a00; --warn-bg: #fdf1d3;
  --u-mem: #eceef5; --u-mem-s: #c5cbda; --u-ctl: #dcebfb; --u-ctl-s: #9fc5ee; --u-alu: #e8e3fa; --u-alu-s: #b9adea;
  --u-io: #e0f3d9; --u-io-s: #a5d392; --cell: #ffffff; --cell-s: #bcc3d0; --bar: #fbfbfd;
  --bus: #cdd2dc; --bus-d: #f2a900; --bus-a: #e0559b; --bus-i: #7c6ae6; --tok: #ffc933; --tok-s: #b97f00; --tok-ink: #2e2100;
  --alu: #7c6ae6; --pcz: #2563eb; --cur: #fff3c4; --hover: #f0ece2;
  --ui: system-ui, -apple-system, "Segoe UI", "Noto Sans", Cantarell, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #10141b; --card: #19202a; --ink: #e9edf3; --ink2: #a3aebd; --ink3: #738092; --line: #2b3441;
  --accent: #6ea0ff; --on-accent: #0b1220; --accent-soft: #1d2c47;
  --good: #4cc38a; --good-bg: #143024; --bad: #ff8a80; --bad-bg: #3a1b1a; --warn: #f2c14e; --warn-bg: #3a2e12;
  --u-mem: #1c232e; --u-mem-s: #36414f; --u-ctl: #152a42; --u-ctl-s: #2c5687; --u-alu: #231f3c; --u-alu-s: #4b4087;
  --u-io: #18301d; --u-io-s: #356b3e; --cell: #0e131a; --cell-s: #3b4656; --bar: #232c38;
  --bus: #364050; --bus-d: #f2a900; --bus-a: #ff6fb3; --bus-i: #9d8cff; --tok: #ffc933; --tok-s: #7a5400; --tok-ink: #2e2100;
  --alu: #9d8cff; --pcz: #6ea0ff; --cur: #3c3413; --hover: #232c38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--ui); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ================= Kopfzeile ================= */
.kopf { flex: none; display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
.marke { display: flex; align-items: center; gap: 9px; margin: 0; font: 800 20px/1 var(--ui); letter-spacing: -.01em; white-space: nowrap; }
.marke svg { width: 34px; height: 34px; flex: none; }
.marke small { font: 500 13px var(--ui); color: var(--ink2); letter-spacing: 0; }
.lehrer { background: var(--warn-bg); color: var(--warn); font: 700 12px var(--ui); padding: 3px 9px; border-radius: 99px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.luft { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 9px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.rund { padding: 6px; border-radius: 50%; }
.menue { position: relative; }
.menue-liste { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 250px; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.22); }
.menue-liste button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.menue-liste button:hover { background: var(--hover); }
.menue-liste button small { display: block; color: var(--ink2); }
.menue-liste .gruppe { padding: 8px 10px 2px; font: 700 12px var(--ui); color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; }

/* ================= Aufteilung ================= */
.haupt { flex: 1; min-height: 0; display: grid; gap: 12px 0; padding: 12px 14px 12px;
  /* --links setzt der Griff; rechts bleiben immer mindestens rund 700px für den Rechner */
  grid-template-columns: clamp(200px, var(--links, clamp(250px, 23vw, 340px)), max(260px, calc(100vw - 760px))) 12px minmax(0, 1fr); }
.griff { position: relative; cursor: col-resize; touch-action: none; outline: none; }
.griff::before { content: ""; position: absolute; left: 4px; top: 50%; width: 4px; height: 44px; margin-top: -22px; border-radius: 2px; background: var(--ink3); opacity: .35; transition: opacity .15s, background .15s, height .15s, margin .15s; }
.griff:hover::before, .griff:focus-visible::before, body.zieht .griff::before { opacity: 1; background: var(--accent); height: 72px; margin-top: -36px; }
body.zieht { cursor: col-resize; user-select: none; }
.karte { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-height: 0; min-width: 0; }
.links { display: flex; flex-direction: column; overflow: hidden; }
.rechts { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }

/* ---------- Editor ---------- */
.ktitel { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; }
.ktitel h2 { margin: 0; font: 700 15px var(--ui); }
.reiter { display: inline-flex; gap: 2px; }
.reiter button { border: 0; background: none; padding: 3px 9px; border-radius: 7px; cursor: pointer; font: 700 15px var(--ui); color: var(--ink3); }
.reiter button[aria-pressed="true"] { color: var(--ink); background: var(--bg); }
.chip { margin-left: auto; font: 600 12.5px var(--ui); padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.fehler { background: var(--bad-bg); color: var(--bad); }
.chip.leer { background: var(--bg); color: var(--ink2); }
.editor { flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); --lh: 23px; font: 15px/var(--lh) var(--mono); background: var(--cell); }
.rinne { flex: none; width: 40px; overflow: hidden; text-align: right; color: var(--ink3); background: var(--bg); padding: 8px 0; user-select: none; font-size: 12.5px; }
.rinne div { height: var(--lh); padding-right: 8px; }
.rinne .err { color: var(--bad); font-weight: 700; box-shadow: inset 3px 0 var(--bad); }
.rinne .wrn { box-shadow: inset 3px 0 var(--warn); }
.rinne .cur { color: var(--ink); font-weight: 700; background: var(--cur); }
.code { position: relative; flex: 1; min-width: 0; }
.code pre, .code textarea { position: absolute; inset: 0; margin: 0; padding: 8px 10px; border: 0; font: inherit; white-space: pre; tab-size: 4; -moz-tab-size: 4; }
.code pre { overflow: hidden; pointer-events: none; }
.code pre > div { display: inline-block; min-width: 100%; }
.code pre .z { height: var(--lh); }
.code pre .z.cur { background: var(--cur); box-shadow: 0 0 0 100vmax var(--cur); clip-path: inset(0 -100vmax); }
.code pre .z.err { text-decoration: underline wavy var(--bad); text-underline-offset: 3px; }
.code textarea { background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: none; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.t-k { color: var(--accent); font-weight: 700; } .t-n { color: #b45309; } .t-v { color: var(--good); font-weight: 600; }
.t-l { color: #a21caf; } .t-c { color: var(--ink3); font-style: italic; } .t-x { color: var(--bad); }
:root[data-theme="dark"] .t-n { color: #f5b461; } :root[data-theme="dark"] .t-l { color: #e39bf0; }
.meld { flex: none; max-height: 34%; overflow: auto; padding: 8px 10px; display: grid; gap: 5px; scrollbar-width: thin; }
.meld p { margin: 0; color: var(--ink2); font-size: 13.5px; }
.meld button { text-align: left; border: 0; border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 13.5px; line-height: 1.35; }
.meld button b { margin-right: 4px; }
.meld .err { background: var(--bad-bg); color: var(--bad); }
.meld .wrn { background: var(--warn-bg); color: var(--warn); }
.prot { flex: 1; min-height: 0; overflow: auto; border-top: 1px solid var(--line); font: 12.5px/1.5 var(--mono); scrollbar-width: thin; }
.prot table { border-collapse: collapse; width: 100%; }
.prot th, .prot td { padding: 1px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
.prot th { position: sticky; top: 0; background: var(--bg); font-weight: 700; }
.prot td:nth-child(3), .prot th:nth-child(3) { text-align: left; }
.protfuss { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; color: var(--ink2); }

/* ---------- Rechner ---------- */
.szene { position: relative; flex: 1; min-height: 0; padding: 6px; }
.szene svg { display: block; width: 100%; height: 100%; }
.eingabe { position: absolute; display: flex; gap: 4px; z-index: 5; }
.eingabe input { min-width: 0; flex: 1; padding: 0 8px; border: 2.5px solid var(--bus-d); border-radius: 8px; background: var(--cell); font: 700 16px var(--mono); text-align: center; box-shadow: 0 0 0 5px rgba(242,169,0,.25); }
.eingabe input { animation: ruf 1.4s ease-in-out infinite; }
@keyframes ruf { 50% { box-shadow: 0 0 0 9px rgba(242,169,0,.12); } }
.eingabe input.falsch { animation: none; border-color: var(--bad); box-shadow: 0 0 0 5px rgba(180,35,24,.22); }
.eingabe.wert input { animation: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); padding: 0 2px; }
.reg.wahl { outline: none; } svg:not(.belegt) .reg.wahl { cursor: pointer; }
svg:not(.belegt) .reg.wahl:hover .box, .reg.wahl:focus-visible .box { stroke: var(--accent); stroke-width: 2; }
.eingabe button { flex: none; border: 0; border-radius: 8px; padding: 0 10px; background: var(--accent); color: var(--on-accent); font-weight: 800; cursor: pointer; }
.zeile { flex: none; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 14px; font-size: 16.5px; line-height: 1.3; }
.zeile .ph { flex: none; box-sizing: border-box; width: 112px; text-align: center; font: 800 12px var(--ui); letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.zeile.fehler { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); font-weight: 600; }
.zeile.fertig { background: var(--good-bg); color: var(--good); border-color: var(--good); font-weight: 600; }
.steuer { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 8px 10px; }
.steuer .btn { padding: 8px 14px; font-size: 15.5px; }
.btn.start { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 118px; justify-content: center; }
.btn.start:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.tempo { display: flex; align-items: center; gap: 8px; margin-left: 6px; color: var(--ink2); font-weight: 600; }
.tempo input { width: 130px; accent-color: var(--accent); }
.tempo output { min-width: 62px; color: var(--ink); }
.steuer label.opt { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font-weight: 600; }
.steuer .weite { margin-left: -6px; }
.steuer .weite select { width: 32px; height: 100%; min-height: 38px; padding: 0; color: transparent; cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background: linear-gradient(45deg, transparent 50%, var(--ink2) 50%) calc(50% - 3.5px) 55% / 7px 7px no-repeat, linear-gradient(135deg, var(--ink2) 50%, transparent 50%) calc(50% + 3.5px) 55% / 7px 7px no-repeat, var(--card); }
.steuer .weite select:hover { background-color: var(--hover); }
.steuer .weite select option { color: var(--ink); }
.steuer select { padding: 8px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.steuer input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
.fuss { flex: none; margin: 0; padding: 5px 12px 7px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Zeichnung ---------- */
.unit { stroke-width: 1.5; }
.u-mem { fill: var(--u-mem); stroke: var(--u-mem-s); } .u-ctl { fill: var(--u-ctl); stroke: var(--u-ctl-s); }
.u-alu { fill: var(--u-alu); stroke: var(--u-alu-s); } .u-io { fill: var(--u-io); stroke: var(--u-io-s); }
.utitel { font: 800 14px var(--ui); fill: var(--ink2); letter-spacing: .08em; text-transform: uppercase; }
.sub { font: 700 12px var(--ui); fill: var(--ink3); letter-spacing: .05em; text-transform: uppercase; paint-order: stroke; stroke: var(--u-mem); stroke-width: 7px; stroke-linejoin: round; }
.bar { fill: var(--bar); stroke: var(--cell-s); stroke-width: 1.2; }
.bartxt { font: 700 12.5px var(--ui); fill: var(--ink3); letter-spacing: .32em; text-anchor: middle; dominant-baseline: central; text-transform: uppercase; }
.box { fill: var(--cell); stroke: var(--cell-s); stroke-width: 1.4; }
.val { font: 600 16px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.val.links { text-anchor: start; font: 500 15px var(--ui); }
.gross .val { font-size: 24px; font-weight: 700; }
.lab { font: 600 13px var(--ui); fill: var(--ink2); }
.adr { font: 12px var(--mono); fill: var(--ink3); text-anchor: end; dominant-baseline: central; }
.name { font: 800 15px var(--mono); fill: var(--good); dominant-baseline: central; }
.leer .val { opacity: .26; }
svg.ein .leer .box { opacity: .32; stroke-dasharray: 3 3; }
svg.ein .adr.frei { opacity: .35; }
.reg { transform-box: fill-box; transform-origin: center; }
.reg.quelle .box { stroke: var(--tok-s); stroke-width: 3; fill: color-mix(in srgb, var(--tok) 28%, var(--cell)); }
.reg.sel .box { stroke: var(--bus-a); stroke-width: 2.6; }
.reg.pcz .box { stroke: var(--pcz); stroke-width: 2.4; }
.reg.pop { animation: huepf .5s cubic-bezier(.3,1.6,.5,1); }
.reg.pop .box { animation: blitz .9s ease-out; }
.reg.puls .box { animation: puls .7s ease-in-out; }
.reg.puls .alu { animation: alupuls .7s ease-in-out; }
@keyframes alupuls { 50% { filter: brightness(1.45); } }
@keyframes huepf { 0% { transform: scale(1); } 35% { transform: scale(1.13); } 100% { transform: scale(1); } }
@keyframes blitz { 0%, 25% { fill: var(--tok); } 100% { fill: var(--cell); } }
@keyframes puls { 0%, 100% { stroke-width: 1.4; } 50% { stroke: var(--bus-i); stroke-width: 4; } }
.zeiger { fill: var(--pcz); transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .2s; }
.zeiger-txt { fill: #fff; }
.bus { fill: none; stroke: var(--bus); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.bus.duenn { stroke-width: 3; }
.bus.a { stroke: color-mix(in srgb, var(--bus-a) 38%, var(--bus)); }
.bus.d { stroke: color-mix(in srgb, var(--bus-d) 42%, var(--bus)); }
svg.flott .zeiger { transition-duration: .12s; }
svg.flott .reg.pop { animation: none; }
svg.flott .reg.pop .box { animation-duration: .35s; }
.trace { fill: none; stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; transition: opacity .6s; }
.trace.d { stroke: var(--bus-d); } .trace.a { stroke: var(--bus-a); } .trace.i { stroke: var(--bus-i); }
.tok { filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.tok rect { fill: var(--tok); stroke: var(--tok-s); stroke-width: 1.5; }
.tok.a rect { fill: var(--bus-a); stroke: none; } .tok.i rect { fill: var(--bus-i); stroke: none; }
.tok text { font: 700 14.5px var(--mono); fill: var(--tok-ink); text-anchor: middle; dominant-baseline: central; }
.tok.a text, .tok.i text { fill: #fff; }
.alu { fill: var(--alu); }
.alusym { font: 800 26px var(--mono); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.pille rect { fill: var(--cell); stroke: var(--u-ctl-s); stroke-width: 1.2; transition: fill .25s; }
.pille text { font: 700 12px var(--ui); fill: var(--ink3); text-anchor: middle; dominant-baseline: central; transition: fill .25s; }
.pille.an rect { fill: var(--accent); stroke: var(--accent); } .pille.an text { fill: var(--on-accent); }
.hinweis { font: 500 15px var(--ui); fill: var(--ink2); dominant-baseline: central; }
.hinweis.gr { font: 700 20px var(--mono); fill: var(--ink); }
.legende { font: 600 11.5px var(--ui); fill: var(--ink3); dominant-baseline: central; }

/* ---------- Dialog ---------- */
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 0; width: min(760px, 94vw); max-height: 90vh; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,14,20,.5); }
.dkopf { display: flex; align-items: center; padding: 14px 18px 8px; position: sticky; top: 0; background: var(--card); }
.dkopf h2 { margin: 0; font: 800 19px var(--ui); flex: 1; }
.dinh { padding: 0 18px 18px; }
.dinh table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.dinh th, .dinh td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dinh td:last-child, .dinh td:first-child { white-space: nowrap; }
.dinh code { font: 600 14px var(--mono); background: var(--bg); padding: 1px 5px; border-radius: 5px; white-space: nowrap; }
.dinh h3 { margin: 16px 0 6px; font: 700 15px var(--ui); }
.dinh ul { margin: 0; padding-left: 20px; } .dinh li { margin: 3px 0; }
.nuradv { display: none !important; } body.adv .nuradv { display: inline-flex !important; }
body.adv td.nuradv, body.adv th.nuradv { display: table-cell !important; }

/* ---------- Kleine Fenster: untereinander, die Seite darf scrollen ---------- */
@media (max-width: 999px), (max-height: 599px) {
  body { height: auto; min-height: 100vh; overflow: auto; }
  .haupt { grid-template-columns: minmax(0, 1fr); } .griff { display: none; }
  .links { height: 340px; }
  .szene { flex: none; aspect-ratio: 128 / 70; }
  .kopf { flex-wrap: wrap; }
}
@media (max-width: 1250px) { .marke small, .btn .lang { display: none; } }
@media (max-width: 1500px) { body.adv .steuer .lang { display: none; } }
.kurz { display: none; }
@media (max-width: 1300px) {
  body.adv .steuer { gap: 8px; }
  body.adv .steuer .btn { padding: 8px 11px; }
  body.adv .btn.start { min-width: 104px; }
  body.adv .tempo { margin-left: 0; gap: 6px; }
  body.adv .tempo input { width: 84px; }
  body.adv .steuer .weg { display: none; }
  body.adv .steuer .kurz { display: inline; }
}
@media (max-width: 1100px) { body.adv .tempo output { display: none; } }
@media (prefers-reduced-motion: reduce) { .reg.pop, .reg.pop .box, .reg.puls .box { animation-duration: .01s; } }
</style>
</head>
<body>
<header class="kopf">
  <h1 class="marke">

<script>
"use strict";
/* <KERN> ================= Rechenkern: Assembler und Rechner (ohne Oberfläche) ================= */
const MAXWERT = 9999, PROGZELLEN = 64, DATEN0 = 64, ZELLEN = 72;
const p2 = n => String(n).padStart(2, "0");
const z4 = v => (v < 0 ? "−" : "") + String(Math.abs(v)).padStart(4, "0");
const zahl = v => (v < 0 ? "−" : "") + Math.abs(v);
const varName = adr => "abcdefgh"[adr - DATEN0];

/* Befehlssatz: adr/val/ziel = Befehlscode für diese Operandenart. Texte: {akk}/{dat} werden durch den Operanden ersetzt. */
const BEFEHLE = {
  ld:  { adr: 10, val: 11, text: "Lade {akk} in den Akku", bsp: "ld a" },
  st:  { adr: 12, text: "Speichere den Akku in {ort}", bsp: "st b" },
  in:  { adr: 20, text: "Lies eine Eingabe und speichere sie in {ort}", bsp: "in a" },
  out: { adr: 22, val: 23, text: "Gib {akk} aus", bsp: "out c" },
  add: { adr: 30, val: 31, sym: "+", text: "Addiere {akk} zum Akku", bsp: "add 1" },
  sub: { adr: 32, val: 33, sym: "−", text: "Subtrahiere {akk} vom Akku", bsp: "sub b" },
  mul: { adr: 34, val: 35, sym: "·", text: "Multipliziere den Akku mit {dat}", bsp: "mul 2" },
  div: { adr: 36, val: 37, sym: ":", text: "Teile den Akku durch {akk} (ohne Rest)", bsp: "div 2" },
  mod: { adr: 38, val: 39, sym: "mod", text: "Berechne den Rest beim Teilen des Akkus durch {akk}", bsp: "mod 2" },
  cmp: { adr: 40, val: 41, sym: "?", text: "Vergleiche den Akku mit {dat}", bsp: "cmp 0" },
  jmp: { ziel: 50, text: "Springe zu Adresse {ziel}", bsp: "jmp start" },
  jlt: { ziel: 52, rel: "<", wort: "kleiner", text: "Springe zu Adresse {ziel}, wenn der Akku kleiner war", bsp: "jlt #4" },
  jeq: { ziel: 54, rel: "=", wort: "gleich", text: "Springe zu Adresse {ziel}, wenn der Akku gleich war", bsp: "jeq fertig" },
  jgt: { ziel: 56, rel: ">", wort: "größer", text: "Springe zu Adresse {ziel}, wenn der Akku größer war", bsp: "jgt weiter" },
  end: { ohne: 60, text: "Ende des Programms", bsp: "end" },
};
const VERWECHSELT = { load: "ld", lade: "ld", store: "st", save: "st", input: "in", read: "in", output: "out", print: "out", write: "out",
  jump: "jmp", goto: "jmp", je: "jeq", jl: "jlt", jg: "jgt", ende: "end", stop: "end", halt: "end", plus: "add", minus: "sub", mult: "mul", compare: "cmp" };

function abstand(a, b) {   // Levenshtein-Abstand für „Meintest du …?“
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function vorschlag(wort) {
  if (VERWECHSELT[wort]) return VERWECHSELT[wort];
  let best = null, bd = 9;
  for (const b in BEFEHLE) { const d = abstand(wort, b); if (d < bd) { bd = d; best = b; } }
  return bd <= 1 || (bd === 2 && wort.length >= 4) ? best : null;
}
function befehlsText(c) {   // Beschreibung eines kodierten Befehls in Worten
  const b = BEFEHLE[c.mn], n = c.art === "adr" ? varName(c.arg) : "";
  return b.text
    .replace("{akk}", c.art === "adr" ? "den Wert von " + n : "die Zahl " + zahl(c.arg))
    .replace("{dat}", c.art === "adr" ? "dem Wert von " + n : "der Zahl " + zahl(c.arg))
    .replace("{ort}", n).replace("{ziel}", p2(c.arg));
}

/* Übersetzt den Quelltext. Ergebnis: { ok, fehler: [{zeile, text}], warnungen: [...], zellen: [{op, arg, mn, art, txt, zeile}] } */
function uebersetze(quelle) {
  const zeilen = String(quelle).replace(/\r\n?/g, "\n").split("\n");
  const fehler = [], warnungen = [], zellen = [], marken = {}, spruenge = [], adrDerZeile = {};
  const F = (zeile, text) => fehler.push({ zeile, text }), W = (zeile, text) => warnungen.push({ zeile, text });
  let ende = false, hatCmp = false, ersterBedingter = 0, zuLang = false;
  zeilen.forEach((roh, i) => {
    const zeile = i + 1;
    let t = roh.split(";")[0];
    if (!t.trim()) return;
    if (ende) { if (ende === true) { W(zeile, "Nach end wird nichts mehr ausgeführt. Diese Zeilen werden übersprungen."); ende = 2; } return; }
    let marke = null;
    const dp = t.indexOf(":");
    if (dp >= 0) {
      marke = t.slice(dp + 1).trim().toLowerCase(); t = t.slice(0, dp);
      if (!t.trim()) return F(zeile, "Vor der Marke fehlt der Befehl. Eine Marke steht rechts neben einem Befehl, zum Beispiel: ld a :start");
      if (!marke) { F(zeile, "Nach dem Doppelpunkt fehlt der Name der Marke."); marke = null; }
      else if (!/^[a-z]/.test(marke)) { F(zeile, `Die Marke „${marke}“ muss mit einem Buchstaben beginnen.`); marke = null; }
      else if (!/^[a-z0-9]+$/.test(marke)) { F(zeile, `Die Marke „${marke}“ darf nur aus Buchstaben (ohne Umlaute) und Ziffern bestehen.`); marke = null; }
      else if (marken[marke]) { F(zeile, `Die Marke „${marke}“ gibt es schon in Zeile ${marken[marke].zeile}.`); marke = null; }
    }
    adrDerZeile[zeile] = zellen.length;   // auch bei einem Fehler in der Zeile, damit Sprünge hierher keine Folgefehler melden
    if (marke) marken[marke] = { zeile, adr: zellen.length, benutzt: false };
    const teile = t.trim().split(/\s+/), mn = teile[0].toLowerCase(), arg = teile.slice(1).join(" ").toLowerCase(), b = BEFEHLE[mn];
    if (!Object.prototype.hasOwnProperty.call(BEFEHLE, mn)) {
      const v = vorschlag(mn);
      return F(zeile, `Den Befehl „${teile[0]}“ gibt es nicht.` + (v ? ` Meintest du „${v}“?` : ""));
    }
    if (zellen.length >= PROGZELLEN) { if (!zuLang) F(zeile, `Das Programm ist zu lang. Es passen höchstens ${PROGZELLEN} Befehle in den Speicher.`); zuLang = true; return; }
    const c = { op: 0, arg: 0, mn, art: null, txt: mn, zeile };
    if (b.ohne) {
      // Wie im Original: Ein end mit Operand hält das Programm an dieser Stelle an, gilt aber nicht als Abschluss des Quelltexts.
      if (arg) W(zeile, "end braucht keinen Operanden. Das Programm hält hier an, der Quelltext muss trotzdem mit einem end ohne Operand enden.");
      else ende = true;
      c.op = b.ohne;
    } else {
      if (!arg) return F(zeile, `Hinter „${mn}“ fehlt der Operand, zum Beispiel: ${b.bsp}`);
      let m;
      if (b.ziel) {
        c.op = b.ziel; c.art = "ziel";
        if ((m = /^#\s*(\d+)$/.exec(arg))) spruenge.push({ c, zeile, nr: +m[1] });
        else if (/^[a-z][a-z0-9]*$/.test(arg)) spruenge.push({ c, zeile, marke: arg });
        else if (/^\d+$/.test(arg)) return F(zeile, `„${arg}“ ist kein Sprungziel. Für Zeile ${arg} schreibst du #${arg}, sonst den Namen einer Marke.`);
        else return F(zeile, `„${arg}“ ist kein Sprungziel. Erlaubt sind eine Zeilennummer wie #4 oder der Name einer Marke.`);
        if (!b.rel) { /* jmp */ } else if (!ersterBedingter) ersterBedingter = zeile;
      } else {
        if ((m = /^\$\s*(\d+)$/.exec(arg))) {
          const adr = +m[1];
          if (adr < DATEN0 || adr >= ZELLEN) return F(zeile, `Die Adresse $${m[1]} ist nicht erlaubt. Für Daten gibt es nur $64 bis $71 (oder a bis h).`);
          c.art = "adr"; c.arg = adr; c.txt = mn + " $" + adr;
        } else if (/^[a-h]$/.test(arg)) { c.art = "adr"; c.arg = DATEN0 + "abcdefgh".indexOf(arg); c.txt = mn + " " + arg; }
        else if (/^[+-]?\d+$/.test(arg)) {
          const v = parseInt(arg, 10);
          if (v > MAXWERT) return F(zeile, `Die Zahl ${arg} ist zu groß. Erlaubt sind −${MAXWERT} bis ${MAXWERT}.`);
          if (v < -MAXWERT) return F(zeile, `Die Zahl ${arg} ist zu klein. Erlaubt sind −${MAXWERT} bis ${MAXWERT}.`);
          c.art = "val"; c.arg = v; c.txt = mn + " " + zahl(v);
        } else if (/^[i-z]$/.test(arg)) return F(zeile, `Die Variable „${arg}“ gibt es nicht. Es gibt nur a bis h.`);
        else return F(zeile, `Mit „${teile.slice(1).join(" ")}“ kann ${mn} nichts anfangen. Erlaubt ist eine Variable (a bis h), eine Adresse ($64 bis $71)${b.val ? " oder eine ganze Zahl" : ""}.`);
        if (!b[c.art]) return F(zeile, `${mn} braucht eine Variable (a bis h) oder eine Adresse ($64 bis $71), keine Zahl.`);
        c.op = b[c.art];
        if (mn === "cmp") hatCmp = true;
      }
    }
    zellen.push(c);
  });
  for (const s of spruenge) {
    let adr;
    if (s.marke !== undefined) {
      const m = marken[s.marke];
      if (!m) { F(s.zeile, `Die Marke „${s.marke}“ gibt es nicht. Eine Marke legst du mit Doppelpunkt rechts neben einem Befehl an, zum Beispiel: ld a :${s.marke}`); continue; }
      m.benutzt = true; adr = m.adr;
    } else {
      adr = adrDerZeile[s.nr];
      if (adr === undefined) { F(s.zeile, `In Zeile ${s.nr} steht kein Befehl, dorthin kann nicht gesprungen werden.`); continue; }
    }
    s.c.arg = adr; s.c.txt = s.c.mn + " " + p2(adr);
  }
  for (const n in marken) if (!marken[n].benutzt) W(marken[n].zeile, `Die Marke „${n}“ wird nie angesprungen.`);
  if (ersterBedingter && !hatCmp) F(ersterBedingter, "Ein bedingter Sprung braucht vorher einen Vergleich mit cmp.");
  if (!zellen.length && !fehler.length) F(0, "Der Quelltext enthält noch keinen Befehl.");
  else if (!ende && !fehler.some(f => /zu lang/.test(f.text))) F(0, "Am Ende des Programms fehlt der Befehl end.");
  fehler.sort((a, b) => a.zeile - b.zeile); warnungen.sort((a, b) => a.zeile - b.zeile);
  return { ok: !fehler.length, fehler, warnungen, zellen: fehler.length ? [] : zellen, leer: !zellen.length && fehler.length === 1 && fehler[0].zeile === 0 && !ende };
}

/* Der Rechner. befehl() liefert die Schritte eines Befehlszyklus nacheinander. Jeder Schritt beschreibt, was passiert
   (txt für „Fortgeschritten“, stxt für „Einfach“), welche Werte wandern (mv, smv) und ändert mit set() den Zustand.
   Felder: ph Phase (F Holen, D Dekodieren, X Ausführen) · einfach: Schritt ist in der einfachen Ansicht sichtbar ·
   phasenEnde, ende (Befehl fertig), ausgabe, eingabe (set bekommt den Wert) · puls: Bauteil ohne Übertragung hervorheben */
class Rechner {
  constructor(zellen, daten) { this.zellen = zellen || []; this.daten = daten || new Array(8).fill(0); this.reset(); }   // daten: Inhalt von a bis h
  reset() {   // wie bei einem echten Rechner bleibt der Datenspeicher stehen, nur die Register beginnen neu
    Object.assign(this, { pc: 0, ir: null, dek: "", opd: 0, acc: 0, alu: "", erg: 0, vgl: "", vglTxt: "", rechnung: "", ein: 0, aus: 0,
      ausgaben: [], sel: -1, fertig: false, fehler: null, anzahl: 0 });
  }
  wert(adr) { return this.daten[adr - DATEN0]; }
  *befehl() {
    const m = this, a = m.pc, c = m.zellen[a];
    if (!c) { yield { ph: "F", einfach: true, txt: "An dieser Adresse steht kein Befehl.", set() { m.fehler = `An Adresse ${p2(a)} steht kein Befehl.`; } }; return; }
    const b = BEFEHLE[c.mn], x = c.arg, adr = c.art === "adr", n = adr ? varName(x) : "", quelle = adr ? "mem:" + x : "ir.arg";
    const fertig = () => { m.anzahl++; m.sel = -1; };
    // ---- Holen ----
    yield { ph: "F", txt: `Der Befehlszähler zeigt auf Adresse ${p2(a)}. Die Adresse geht an den Speicher.`,
      mv: [{ von: "pc", nach: "mem:" + a, wert: p2(a), bus: "a" }], set() { m.sel = a; } };
    yield { ph: "F", einfach: true, txt: `Der Inhalt der Zelle ${p2(a)} wird ins Befehlsregister geholt.`, stxt: `Der Befehl aus Zelle ${p2(a)} wird geholt: ${c.txt}`,
      mv: [{ von: "mem:" + a, nach: "ir", zelle: c, bus: "d" }], set() { m.ir = c; m.dek = ""; m.sel = -1; } };
    yield { ph: "F", phasenEnde: true, puls: "pc", txt: `Der Befehlszähler wird um 1 erhöht und zeigt jetzt auf Adresse ${p2(a + 1)}.`, set() { m.pc = a + 1; } };
    // ---- Dekodieren ----
    const worte = befehlsText(c);
    yield { ph: "D", phasenEnde: true, txt: `Der Dekodierer erkennt den Befehlscode ${c.op}: ${worte}.`,
      mv: [{ von: "ir.op", nach: "dek", wert: String(c.op), bus: "i" }], set() { m.dek = worte; } };
    // ---- Ausführen ----
    const adresse = () => ({ ph: "X", txt: `Der Operand ${x} ist die Adresse der Zelle ${n}. Sie geht an den Speicher.`,
      mv: [{ von: "ir.arg", nach: "mem:" + x, wert: String(x), bus: "a" }], set() { m.sel = x; } });
    const woher = adr ? `Der Wert von ${n}` : `Die Zahl ${zahl(x)} aus dem Befehlsregister`;
    if (c.mn === "ld") {
      if (adr) yield adresse();
      const v = adr ? m.wert(x) : x;
      yield { ph: "X", einfach: true, ende: true, txt: `${woher}${adr ? ` (${zahl(v)})` : ""} wird in den Akku geladen.`, stxt: `${c.txt}: ${woher}${adr ? ` (${zahl(v)})` : ""} wird in den Akku geladen.`,
        mv: [{ von: quelle, nach: "acc", wert: v, bus: "d" }], set() { m.acc = v; fertig(); } };
    } else if (c.mn === "st") {
      yield adresse();
      const v = m.acc;
      yield { ph: "X", einfach: true, ende: true, txt: `Der Wert des Akkus (${zahl(v)}) wird in ${n} gespeichert.`, stxt: `${c.txt}: Der Wert des Akkus (${zahl(v)}) wird in ${n} gespeichert.`,
        mv: [{ von: "acc", nach: "mem:" + x, wert: v, bus: "d" }], set() { m.daten[x - DATEN0] = v; fertig(); } };
    } else if (c.mn === "in") {
      yield { ph: "X", einfach: true, eingabe: true, name: n, txt: `Der Rechner wartet auf eine Eingabe für ${n}. Tippe eine ganze Zahl und drücke Enter.`, set(v) { m.ein = v; } };
      yield adresse();
      const v = m.ein;
      yield { ph: "X", einfach: true, ende: true, txt: `Die Eingabe ${zahl(v)} wird in ${n} gespeichert.`, stxt: `${c.txt}: Die Eingabe ${zahl(v)} wird in ${n} gespeichert.`,
        mv: [{ von: "ein", nach: "mem:" + x, wert: v, bus: "d" }], set() { m.daten[x - DATEN0] = v; fertig(); } };
    } else if (c.mn === "out") {
      if (adr) yield adresse();
      const v = adr ? m.wert(x) : x;

  const form = $("wert"), k = K["mem:" + (DATEN0 + wertNr)];
  if (form.hidden || !k) return;
  const r = k.box.getBoundingClientRect(), s = $("szene").getBoundingClientRect();
  const h = Math.max(r.height, 30), w = Math.max(r.width, 76);
  Object.assign(form.style, { left: r.left - s.left - (w - r.width) / 2 + "px", top: r.top - s.top - (h - r.height) / 2 + "px", width: w + "px", height: h + "px" });
}
function schliesseWert() { $("wert").hidden = true; wertNr = -1; }
$("wert").addEventListener("submit", e => {
  e.preventDefault();
  const feld = $("wertFeld"), v = zahlText(feld.value), j = wertNr;
  if (v === null || j < 0) { nochmal(feld, "falsch"); feld.select(); return; }
  M.daten[j] = v; schliesseWert();
  zeige(true);
});
$("wertFeld").addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); schliesseWert(); } });
$("wertFeld").addEventListener("blur", () => { if (!$("wert").hidden) schliesseWert(); });
$("eingabe").addEventListener("submit", e => {
  e.preventDefault();
  const feld = $("einFeld"), v = zahlText(feld.value);
  if (v === null) {
    nochmal(feld, "falsch"); satz = `Das geht nicht. Tippe eine ganze Zahl von −${MAXWERT} bis ${MAXWERT}.`; zeigeText(); feld.select();
    return;
  }
  $("eingabe").hidden = true;
  const f = eingabeFertig; eingabeFertig = null;
  if (f) f(v);
});

/* ---- Erklärzeile und Knöpfe ---- */
const SYM = {
  start: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>',
};
function zeigeText() {
  const z = $("zeile"), ph = $("phase");
  let t = satz, art = "";
  if (!U.ok) t = U.leer || !meldungenSichtbar ? "Schreibe links dein Programm. Der Rechner übersetzt es beim Tippen." : "Im Programm steckt noch ein Fehler. Die Hinweise stehen unter dem Editor.";
  else if (lauf === "fehler") { t = M.fehler; art = "fehler"; }
  else if (lauf === "ende") { t = "Fertig! Das Programm ist beendet." + (M.ausgaben.length ? ` Ausgabe: ${M.ausgaben.slice(-12).map(zahl).join(", ")}` : ""); art = "fertig"; }
  else if (lauf === "bereit") t = "Bereit. „Start“ lässt das Programm laufen, mit dem Knopf daneben gehst du es Schritt für Schritt durch.";
  z.className = "karte zeile " + art;
  const pt = { F: "Holen", D: "Dekodieren", X: "Ausführen" }[phase];
  ph.hidden = !(pt && U.ok && (lauf === "laeuft" || lauf === "pause" || lauf === "eingabe"));
  if (!ph.hidden && ph.textContent !== pt) ph.textContent = pt;
  if ($("text").textContent !== t) $("text").textContent = t;
}
let knopfAlt = "";
function zeigeKnoepfe() {
  const s = $("startBtn"), k = lauf + U.ok;
  if (k === knopfAlt) return;
  knopfAlt = k;
  s.innerHTML = lauf === "laeuft" ? SYM.pause + "Pause" : SYM.start + (lauf === "pause" ? "Weiter" : lauf === "ende" || lauf === "fehler" ? "Neu starten" : "Start");
  s.disabled = $("schrittBtn").disabled = !U.ok || lauf === "eingabe";
  $("resetBtn").disabled = lauf === "bereit";
  svg.classList.toggle("belegt", lauf === "laeuft" || lauf === "eingabe");
  if (lauf === "laeuft" || lauf === "eingabe") schliesseWert();
}
$("startBtn").addEventListener("click", start);
$("schrittBtn").addEventListener("click", schritt);
$("resetBtn").addEventListener("click", zuruecksetzen);
function zeigeEinstellungen() {
  $("tempo").value = Z.tempo; $("tempoTxt").textContent = TEMPONAME[Z.tempo]; svg.classList.toggle("flott", flott());
  $("gran").value = Z.gran; $("ausStopp").checked = Z.ausStopp;
  $("schrittTxt").textContent = einfach() ? "Schritt" : { mikro: "1 Mikroschritt", phase: "1 Phase", befehl: "1 Befehl" }[Z.gran];
  $("modEin").setAttribute("aria-pressed", einfach()); $("modAdv").setAttribute("aria-pressed", !einfach());
  document.body.classList.toggle("adv", !einfach());
  setzeBreite(Z.breite, false);
}
$("tempo").addEventListener("input", e => { Z.tempo = +e.target.value; zeigeEinstellungen(); sichere(); });
$("gran").addEventListener("change", e => { Z.gran = e.target.value; zeigeEinstellungen(); sichere(); });
$("ausStopp").addEventListener("change", e => { Z.ausStopp = e.target.checked; sichere(); });
function setzeAnsicht(mode) {
  if (Z.mode === mode) return;
  Z.mode = mode; stoppe(); zeigeEinstellungen(); baue(); zeige(false); sichere();
}
$("modEin").addEventListener("click", () => setzeAnsicht("ein"));
$("modAdv").addEventListener("click", () => setzeAnsicht("adv"));

/* ---- Editor-Ereignisse ---- */
src.addEventListener("input", () => quelltextGeaendert(false));
src.addEventListener("scroll", rolle);
$("meld").addEventListener("click", e => {
  const b = e.target.closest("button[data-zeile]"); if (!b) return;
  const nr = +b.dataset.zeile; if (!nr) return src.focus();
  const zeilen = src.value.split("\n"), anfang = zeilen.slice(0, nr - 1).reduce((s, z) => s + z.length + 1, 0);
  src.focus(); src.setSelectionRange(anfang, anfang + zeilen[nr - 1].length);
  src.scrollTop = Math.max(0, (nr - 4) * 23); rolle();
});

/* ---- Beispiele, Dateien, Hilfe, Design ---- */
function maleBeispiele() {
  const eintrag = (b, i, art) => `<button data-art="${art}" data-i="${i}">${esc(b.name)}<small>${esc(b.info)}</small></button>`;
  $("bspListe").innerHTML = BEISPIELE.map((b, i) => eintrag(b, i, "b")).join("")
    + (lehrer ? '<div class="gruppe">Lösungen (nur im Lehrermodus)</div>' + LOESUNGEN.map((b, i) => eintrag(b, i, "l")).join("") : "");
}
function menue(auf) { $("bspListe").hidden = !auf; $("bspBtn").setAttribute("aria-expanded", auf); }
$("bspBtn").addEventListener("click", e => { e.stopPropagation(); menue($("bspListe").hidden); });
document.addEventListener("click", e => { if (!e.target.closest(".menue")) menue(false); });
const eigenesProgramm = () => src.value.trim() && !BEISPIELE.concat(LOESUNGEN).some(b => b.src.trim() === src.value.trim());
$("bspListe").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  menue(false);
  if (eigenesProgramm() && !confirm("Dein Programm im Editor wird durch das Beispiel ersetzt. Fortfahren?")) return;
  ladeQuelltext((b.dataset.art === "l" ? LOESUNGEN : BEISPIELE)[+b.dataset.i].src);
});
$("oeffnenBtn").addEventListener("click", () => $("datei").click());
$("datei").addEventListener("change", async e => {
  const d = e.target.files[0]; e.target.value = "";
  if (!d) return;
  const bytes = await d.arrayBuffer();
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (err) { text = new TextDecoder("windows-1252").decode(bytes); }   // alte Dateien mit Umlauten
  if (eigenesProgramm() && !confirm("Dein Programm im Editor wird durch die Datei ersetzt. Fortfahren?")) return;
  // Projektdateien des MOPS-Nachbaus einer Kollegin (*.mops.json): Quelltext und Startwerte von a bis h
  let start = null;
  if (/^\s*\{/.test(text)) {
    let p = null;
    try { p = JSON.parse(text); } catch (err) {}
    if (!p || typeof p.source !== "string") { alert("In dieser Datei steckt kein MOPS-Programm."); return; }
    text = p.source;
    if (Array.isArray(p.startData)) start = Array.from({ length: 8 }, (_, j) => { const v = Math.trunc(Number(p.startData[j])); return Math.abs(v) <= MAXWERT ? v : 0; });
  }
  ladeQuelltext(text, start);
});
$("speichernBtn").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([src.value], { type: "text/plain;charset=utf-8" }));
  a.download = "programm.ass";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$("hilfeInhalt").innerHTML = `<table><thead><tr><th>Befehl</th><th>Was er tut</th><th>Beispiel</th><th>Code</th></tr></thead><tbody>${Object.keys(BEFEHLE).map(mn => {
  const b = BEFEHLE[mn], op = b.ohne ? "" : b.ziel ? " ziel" : b.val ? " x" : " var";
  return `<tr><td><code>${mn}${op}</code></td><td>${HILFE[mn]}</td><td><code>${b.bsp}</code></td><td>${[b.adr, b.val, b.ziel, b.ohne].filter(Boolean).join(" / ")}</td></tr>`;
}).join("")}</tbody></table>
<h3>Schreibweise</h3><ul>
<li>In jeder Zeile steht ein Befehl. Das Programm endet mit <code>end</code>. Groß- und Kleinschreibung ist egal.</li>
<li><code>var</code> ist eine der acht Variablen <code>a</code> bis <code>h</code>. Sie liegen in den Speicherzellen <code>$64</code> bis <code>$71</code>, du kannst auch die Adresse schreiben.</li>
<li><code>x</code> ist eine Variable oder eine ganze Zahl von −9999 bis 9999.</li>
<li><code>ziel</code> ist eine Marke oder eine Zeilennummer mit Raute, zum Beispiel <code>#4</code>. Eine Marke legst du rechts neben einem Befehl mit Doppelpunkt an: <code>ld a :start</code>. Angesprungen wird sie ohne Doppelpunkt: <code>jmp start</code>.</li>
<li>Alles hinter einem Semikolon ist ein Kommentar: <code>add 1 ; eins weiterzählen</code></li>
<li>Jeder Befehl belegt eine Speicherzelle. Die Spalte „Code“ nennt den Befehlscode (erste Zahl: mit Variable, zweite Zahl: mit Zahl).</li></ul>
<h3>Tasten</h3><ul><li><code>Strg + Enter</code>: Start und Weiter · <code>F6</code>: Schritt · <code>Leertaste</code>: Pause und Weiter · <code>Esc</code>: Zurücksetzen</li></ul>`;
$("hilfeBtn").addEventListener("click", () => $("hilfe").showModal());
$("hilfeZu").addEventListener("click", () => $("hilfe").close());
$("hilfe").addEventListener("click", e => { if (e.target === $("hilfe")) $("hilfe").close(); });
const DESIGN = KENNUNG + "-design";
function setzeDesign(d) { document.documentElement.dataset.theme = d; }
(() => { let d = null; try { d = localStorage.getItem(DESIGN); } catch (e) {} setzeDesign(d === "dark" ? "dark" : "light"); })();
$("themaBtn").addEventListener("click", () => {
  const d = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  setzeDesign(d); try { localStorage.setItem(DESIGN, d); } catch (e) {}
});

/* ---- Lehrermodus: Lösungen im Beispielmenü und Ablaufprotokoll ---- */
function reiter(prot) {
  $("tabProg").setAttribute("aria-pressed", !prot); $("tabProt").setAttribute("aria-pressed", prot);
  $("editor").hidden = $("meld").hidden = prot; $("prot").hidden = $("protFuss").hidden = !prot;
  if (prot) maleProtokoll(); else rolle();
}
$("tabProg").addEventListener("click", () => reiter(false));
$("tabProt").addEventListener("click", () => reiter(true));
const PROTKOPF = ["Nr.", "Adr.", "Befehl", "Akku", "Vgl", "a", "b", "c", "d", "e", "f", "g", "h", "Aus"];
let protAlt = -1;
function maleProtokoll() {
  if (protAlt === protokoll.length && protokoll.length) return;
  protAlt = protokoll.length;
  const sicht = protokoll.slice(-300);
  $("prot").innerHTML = `<table><thead><tr>${PROTKOPF.map(k => `<th>${k}</th>`).join("")}</tr></thead><tbody>${sicht.map(z => `<tr>${z.map(v => `<td>${esc(String(v))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  $("prot").scrollTop = $("prot").scrollHeight;
  $("protInfo").textContent = protokoll.length ? `${protokoll.length} Befehle` + (protokoll.length > 300 ? " (die letzten 300 sichtbar)" : "") : "Noch nichts gelaufen.";
}
$("protKopie").addEventListener("click", async () => {
  const text = [PROTKOPF].concat(protokoll).map(z => z.join("\t")).join("\n");
  try { await navigator.clipboard.writeText(text); $("protInfo").textContent = "Kopiert. In die Tabellenkalkulation einfügen."; }
  catch (e) { $("protInfo").textContent = "Kopieren ist hier nicht erlaubt."; }
});
function zeigeLehrer() {
  $("lehrerMarke").hidden = !lehrer; $("reiter").hidden = !lehrer; $("progTitel").hidden = lehrer;
  if (!lehrer) reiter(false);
  maleBeispiele();
}
function schalteLehrer() {
  if (LEHRERMODUS) return;
  lehrer = !lehrer;
  if (lehrer) { clearTimeout(saveTimer); clearTimeout(scormTimer); if (moodleOffen) speichereMoodle(); lehrerStand = JSON.stringify(Z); lehrerDaten = DATEN.slice(); }
  else { Z = JSON.parse(lehrerStand); lehrerStand = null; zeigeEinstellungen(); if (bauArt !== bauSoll()) baue(); ladeQuelltext(Z.src, lehrerDaten); }
  zeigeLehrer();
}

/* ---- Griff zwischen Programm und Rechner ---- */
function setzeBreite(b, merken) {
  Z.breite = b > 0 ? Math.min(1200, Math.max(200, Math.round(b))) : 0;
  const h = document.querySelector(".haupt");
  if (Z.breite) h.style.setProperty("--links", Z.breite + "px"); else h.style.removeProperty("--links");
  if (merken) sichere();
}
(() => {
  const g = $("griff"), links = document.querySelector(".links");
  let x0 = 0, b0 = 0, zieht = false;
  const ende = e => { if (!zieht) return; zieht = false; document.body.classList.remove("zieht"); setzeBreite(links.getBoundingClientRect().width, true); };   // gemerkt wird die wirklich erreichte Breite
  g.addEventListener("pointerdown", e => { if (e.button) return; e.preventDefault(); zieht = true; x0 = e.clientX; b0 = links.getBoundingClientRect().width; g.setPointerCapture(e.pointerId); document.body.classList.add("zieht"); });
  g.addEventListener("pointermove", e => { if (zieht) setzeBreite(Math.max(200, b0 + e.clientX - x0), false); });
  g.addEventListener("pointerup", ende); g.addEventListener("pointercancel", ende);
  g.addEventListener("dblclick", () => setzeBreite(0, true));
  g.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); setzeBreite(links.getBoundingClientRect().width + (e.key === "ArrowLeft" ? -16 : 16), true);
    setzeBreite(links.getBoundingClientRect().width, true);
  });
})();

/* ---- Tasten ---- */
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.shiftKey && e.code === "KeyL") { e.preventDefault(); schalteLehrer(); return; }
  if ($("hilfe").open) return;
  const imFeld = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (lauf !== "laeuft") start(); }
  else if (e.key === "F6") { e.preventDefault(); schritt(); }
  else if (e.key === "Escape") { if (!$("bspListe").hidden) menue(false); else if (!$("resetBtn").disabled) { e.preventDefault(); zuruecksetzen(); } }   // Esc tut genau das, was der Knopf tut
  else if (e.key === " " && !imFeld && e.target.tagName !== "BUTTON") { e.preventDefault(); start(); }
});
window.addEventListener("resize", () => { legeEingabe(); legeWert(); });
if (window.ResizeObserver) new ResizeObserver(() => { legeEingabe(); legeWert(); }).observe($("szene"));

/* ---- Start ---- */
src.value = Z.src;
zeigeEinstellungen(); zeigeLehrer(); baue(); stoppe(); maleEditor(); maleMeldungen(); zeige(false);
</script>
</body>
</html>
